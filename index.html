<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ແບ່ງກຸ່ມ BF124</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Lao+Looped:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* palette: only #972828 #e45742 #eb7f31 #fcad38; other tokens are tints/shades of them */
:root{--c1:#972828;--c2:#e45742;--c3:#eb7f31;--c4:#fcad38;
  --bg:#fff4e3;--card:#fffcf6;--ink:#3a1010;--mute:#85503f;--line:#f6dfbd;--accent:#972828;--accent-ink:#fff6e8;
  --me:#fde5c6;--bad:#972828;--shadow:rgba(151,40,40,.28);--errbg:#ffd9cf;--errink:#7a1c1c;
  --display:'Noto Sans Lao Looped','Noto Sans Lao',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#2a0c0c;--card:#3a1414;--ink:#ffe9c9;--mute:#e0b48f;--line:#5a2323;--accent:#fcad38;--accent-ink:#2a0c0c;
  --me:#4a1c1a;--bad:#fcad38;--shadow:rgba(0,0,0,.45);--errbg:#5a2323;--errink:#ffd2c4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Lao',system-ui,sans-serif;line-height:1.55}
main{max-width:960px;margin:0 auto;padding:16px 16px 48px}
h1{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.25}
h2{font-family:var(--display);font-size:1.05rem;margin:0}
.mute{color:var(--mute);font-size:.9rem}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 20px;margin-bottom:16px;color:#3a1010;
  background:linear-gradient(135deg,var(--c4) 0%,var(--c3) 58%,var(--c2) 100%);box-shadow:0 10px 24px -14px var(--shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,246,232,.28);pointer-events:none}
.hero::before{width:140px;height:140px;right:-30px;top:-50px}
.hero::after{width:80px;height:80px;right:70px;bottom:-34px;background:rgba(255,246,232,.2)}
.hero .sub{position:relative;font-size:.95rem;margin-top:4px;opacity:.9}
.hero h1{position:relative}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 8px 18px -14px var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.card.me{border-color:var(--c3);background:var(--me)}
.card.full:not(.me){opacity:.7}
.g1{--gc:var(--c1);--gi:#fff6e8}.g2{--gc:var(--c2);--gi:#2a0c0c}.g3{--gc:var(--c3);--gi:#2a0c0c}.g4{--gc:var(--c4);--gi:#2a0c0c}
@media (prefers-color-scheme:dark){.g1{--gc:#ffd08a;--gi:#2a0c0c}.g2{--gc:var(--c4)}.g3{--gc:var(--c3)}.g4{--gc:var(--c2)}}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.gt{display:flex;align-items:center;gap:8px;min-width:0}
.badge{width:34px;height:34px;border-radius:50%;background:var(--gc,var(--c3));color:var(--gi,#2a0c0c);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none}
.cnt{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}
.cnt.full{color:var(--bad);font-weight:600}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--gc,var(--c3));display:block}
.dots i.on{background:var(--gc,var(--c3))}
.note{margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.note.open{display:block;padding:9px 10px;border-radius:14px;background:color-mix(in srgb,var(--gc,var(--c3)) 12%,var(--card))}
.ov{position:fixed;inset:0;background:rgba(20,5,5,.6);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;width:100%;max-width:340px;box-shadow:0 20px 40px -20px #000}
.dlg .danger-fill{background:var(--bad);border-color:var(--bad);color:var(--card)}
.dlg input{width:100%;box-sizing:border-box;text-align:center;letter-spacing:.3em;font-size:1.2rem}
.ncount{text-align:right;font-size:.75rem;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.hist{padding:6px 0;border-top:1px solid var(--line);font-size:.9rem;overflow-wrap:anywhere}
.nline{flex:1;min-width:0;font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mute)}
.nby{font-size:.75rem}
.pen{min-height:30px!important;width:30px;padding:0!important;border-radius:50%!important;font-size:.95rem;line-height:1;color:var(--mute);flex:none;margin-left:auto}
.nmsg{flex-basis:100%;font-size:.8rem;color:var(--mute)}.nmsg.bad{color:var(--bad);font-weight:600}
.note textarea{width:100%;box-sizing:border-box;font:inherit;font-size:.9rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;resize:vertical}
ul{list-style:none;margin:0 0 10px;padding:0;min-height:30px}
li{padding:3px 0;font-size:.92rem;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
li.self{font-weight:700;color:var(--accent)}
li.empty{color:var(--mute);font-size:.82rem}
.av{width:24px;height:24px;border-radius:50%;background:var(--gc,var(--c3));color:var(--gi,#2a0c0c);display:grid;place-items:center;font-size:.78rem;font-weight:600;flex:none}
button,select,input{font:inherit}
button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:42px;transition:transform .12s,box-shadow .12s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 12px -8px var(--shadow)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.card button.primary{width:100%}
:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
select,input{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;min-height:42px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.banner{padding:11px 14px;border-radius:16px;margin-top:12px;font-size:.92rem}
.banner.lock{background:var(--c4);color:#3a1010}.banner.err{background:var(--errbg);color:var(--errink)}
a{color:var(--accent)}
.nav{display:flex;justify-content:space-between;margin-bottom:12px;font-size:.9rem}
.pool{margin-top:20px}.pool span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:2px 12px 2px 4px;margin:4px 4px 0 0;font-size:.84rem;background:var(--card)}
.pool .av{width:20px;height:20px;font-size:.7rem}
.tiny{min-height:30px;padding:2px 8px;font-size:.8rem}
@media (prefers-reduced-motion:reduce){button{transition:none}}
/* cartoon chase lives in the right side of the hero banner (drawn in SVG, no image files) */
.hero{isolation:isolate;min-height:132px}
.hero::before,.hero::after{z-index:-1}
.hero h1,.hero .sub{position:relative;z-index:1;max-width:56%}
.hero .chase{position:absolute;right:0;bottom:0;width:44%;height:100%;overflow:hidden;pointer-events:none}
.chase .pair{position:absolute;left:-300px;bottom:8px;display:flex;align-items:flex-end;gap:30px;animation:chase-run 10s linear var(--d,0s) infinite}
.chase .kids{display:flex;align-items:flex-end;gap:2px}
.chase .stuwrap{position:relative}
.chase .say{position:absolute;left:-4px;top:-15px;font-size:.72rem;line-height:1.5;white-space:nowrap;background:var(--card);border:2px solid #972828;color:var(--ink);border-radius:999px;padding:0 9px;animation:chase-say .7s ease-in-out infinite}
.chase .leg,.chase .arm{transform-box:fill-box;transform-origin:50% 8%}
.chase .legA{animation:legA var(--sp,.36s) ease-in-out var(--ph,0s) infinite}
.chase .legB{animation:legB var(--sp,.36s) ease-in-out var(--ph,0s) infinite}
.chase .arm{animation:armS var(--sp,.36s) ease-in-out var(--ph,0s) infinite}
.chase .bodybob{animation:bob var(--sp,.36s) ease-in-out var(--ph,0s) infinite}
.chase .ghwrap{animation:lunge 1.8s ease-in-out infinite}
.chase .gfloat{animation:gfloat 1.2s ease-in-out infinite}
.chase .sweat{animation:sweat .8s ease-in infinite}
@keyframes chase-run{from{left:-300px}to{left:100%}}
@keyframes legA{0%,100%{transform:rotate(40deg)}50%{transform:rotate(-40deg)}}
@keyframes legB{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(40deg)}}
@keyframes armS{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(55deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes gfloat{0%,100%{transform:translateY(-2px) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes lunge{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes sweat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes chase-say{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (max-width:620px){.hero h1,.hero .sub{max-width:none}.hero .chase{position:relative;width:100%;height:122px;margin-top:6px}}
@media (prefers-reduced-motion:reduce){.chase .pair{animation:none;left:calc(50% - 140px)}.chase *{animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ====== ໃສ່ຄ່າຈາກ Supabase > Project Settings > API ======
const SUPABASE_URL = 'https://bnlyewxojqbpfuiakpqr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Do6cExWBminTmtHnzvLMKA_WhLFJTzf';
// ==========================================================

const app = document.getElementById('app');
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
const sget = k => { try { return sessionStorage.getItem(k); } catch { return null; } };
const sset = (k,v) => { try { sessionStorage.setItem(k,v); } catch {} };

if (SUPABASE_URL.startsWith('PASTE')) {
  app.append(h('div', {class:'banner err'}, 'ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ Supabase: ແກ້ SUPABASE_URL ແລະ SUPABASE_KEY ໃນໄຟລ໌ index.html'));
  throw new Error('not configured');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let students = [], allStudents = [], activities = [], members = [], notes = [], channel = null, toast = '';
const noteDraft = {}; // unsent note text per group, kept across live re-renders
const byCode = () => Object.fromEntries(students.map(s => [s.code, s]));
const label = s => `${s.gender || ''} ${s.name}`.trim();
const me = () => store.get('me');

// students never change while the page is open, so they are fetched once
async function load() {
  const [s, a, m, n] = await Promise.all([
    allStudents.length ? {data: allStudents} : sb.from('students').select('*').order('no'),
    sb.from('activities').select('*').order('created_at', {ascending:false}),
    sb.from('memberships').select('*'),
    sb.from('group_notes').select('*'),
  ]);
  notes = n.data || notes;
  const err = s.error || a.error || m.error;
  if (err) { toast = 'ໂຫຼດຂໍ້ມູນບໍ່ໄດ້: ' + err.message; }
  allStudents = s.data || allStudents;
  students = allStudents.filter(x => x.active !== false); // people who left are hidden everywhere except the admin roster
  activities = a.data || activities; members = m.data || members;
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { toast = error.message; if (/PIN/.test(error.message)) store.del('mypin'); } else { toast = ''; }
  await load(); render();
  return { data, error };
}

function subscribe() {
  if (channel) return;
  let t;
  const later = fn => { clearTimeout(t); t = setTimeout(fn, 150); };
  // membership changes are applied straight from the event (no re-download), so a burst of
  // joins costs each viewer zero extra queries; only activity edits trigger a reload
  const sameKey = (a, b) => a.activity_id === b.activity_id && a.student_code === b.student_code;
  channel = sb.channel('live')
    .on('postgres_changes', {event:'*', schema:'public', table:'memberships'}, p => {
      if (p.eventType === 'DELETE') members = members.filter(m => !sameKey(m, p.old));
      else members = members.filter(m => !sameKey(m, p.new)).concat(p.new);
      later(render);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'group_notes'}, p => {
      const same = (a, b) => a.activity_id === b.activity_id && a.group_no === b.group_no;
      if (p.eventType === 'DELETE') notes = notes.filter(x => !same(x, p.old));
      else notes = notes.filter(x => !same(x, p.new)).concat(p.new);
      later(render);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'activities'}, () => later(async () => { await load(); render(); }))
    .on('postgres_changes', {event:'*', schema:'public', table:'students'}, () => later(async () => { allStudents = []; await load(); render(); }))
    .subscribe(status => {
      // after a dropped connection, resync once so nothing is missed
      if (status === 'SUBSCRIBED' && channel.__wasDown) { channel.__wasDown = false; load().then(render); }
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') channel.__wasDown = true;
    });
  setInterval(async () => { // safety net: resync once a minute, redraw only if something differs
    if (document.hidden) return;
    const before = JSON.stringify([activities, members, notes]);
    await load();
    if (JSON.stringify([activities, members, notes]) !== before) render();
  }, 60000);
}

const route = () => location.hash.replace(/^#\/?/, '');

let skipRestore = false;
function render() {
  // live updates rebuild the page; keep what the person is typing and which box has focus
  const old = [...app.querySelectorAll('input')];
  const typed = old.map(i => i.value), focused = old.indexOf(document.activeElement);
  const fa = document.activeElement;
  const focusedNote = fa && fa.tagName === 'TEXTAREA' && fa.dataset.k ? {k: fa.dataset.k, s: fa.selectionStart, e: fa.selectionEnd} : null;
  const r = route();
  app.replaceChildren();
  if (toast) app.append(h('div', {class:'banner err'}, toast));
  if (r === 'admin') renderAdmin();
  else if (r.startsWith('a/')) renderActivity(r.slice(2));
  else renderHome();
  if (focusedNote) { // a note box being typed in keeps focus and cursor across live updates
    const ta = [...app.querySelectorAll('textarea')].find(t => t.dataset.k === focusedNote.k);
    if (ta) { ta.focus(); try { ta.setSelectionRange(focusedNote.s, focusedNote.e); } catch {} }
  }
  const now = [...app.querySelectorAll('input')];
  if (!skipRestore && now.length === typed.length) {
    now.forEach((i, k) => { if (typed[k] !== '' && i.value !== typed[k]) i.value = typed[k]; });
    if (focused >= 0) now[focused].focus();
  }
  skipRestore = false;
}

const T0 = performance.now();
const hero = (title, sub) => {
  const c = h('div', {class:'chase', 'aria-hidden':'true', style:`--d:-${(((performance.now() - T0) / 1000) % 9).toFixed(2)}s`});
  c.innerHTML = CHASE_SVG;
  return h('header', {class:'hero'}, h('h1', {}, title), sub ? h('div', {class:'sub'}, sub) : null, c);
};
const initial = s => Array.from(s.name.trim()).find(c => !'ເແໂໄໃ'.includes(c)) || '?';

function renderHome() {
  app.append(hero('ແບ່ງກຸ່ມ BF124', 'ເລືອກກຸ່ມກັບເພື່ອນໆ ✿'));
  if (!activities.length) app.append(h('div', {class:'card', style:'margin-top:12px'}, 'ຍັງບໍ່ມີກິດຈະກຳ ລໍຖ້າແອດມິນສ້າງກ່ອນນະ ♡'));
  for (const a of activities)
    app.append(h('a', {href:'#/a/' + a.id, style:'text-decoration:none;color:inherit'},
      h('div', {class:'card', style:'margin-top:12px'},
        h('h2', {}, a.title, a.locked ? ' 🔒' : ''),
        h('div', {class:'mute'}, `${a.group_count} ກຸ່ມ × ${a.group_size} ຄົນ`))));
  app.append(h('p', {class:'mute'}, h('a', {href:'#/admin'}, 'ແອດມິນ')));
}

function renderActivity(id) {
  const a = activities.find(x => x.id === id);
  if (!a) return app.append(h('div', {class:'nav'}, h('a', {href:'#/'}, '← ກັບຄືນ')), h('div', {class:'card'}, 'ບໍ່ພົບກິດຈະກຳ'));
  const codes = byCode();
  const mine = codes[me()] ? me() : null; // a name that was removed from the roster is treated as "not chosen"
  const ms = members.filter(m => m.activity_id === id);
  const myGroup = ms.find(m => m.student_code === mine)?.group_no;

  app.append(h('div', {class:'nav'}, h('a', {href:'#/'}, '← ກັບຄືນ')),
    hero(a.title, `${a.group_count} ກຸ່ມ · ກຸ່ມລະ ${a.group_size} ຄົນ`));
  if (a.locked) app.append(h('div', {class:'banner lock'}, '🔒 ກິດຈະກຳນີ້ຖືກລ໋ອກແລ້ວ ປ່ຽນກຸ່ມບໍ່ໄດ້'));

  // ເລືອກຊື່ຕົນເອງ
  const mypin = store.get('mypin');
  const sel = h('select', {onchange: e => { store.del('mypin'); e.target.value ? store.set('me', e.target.value) : store.del('me'); toast = ''; render(); }},
    h('option', {value:''}, '— ເລືອກຊື່ຂອງເຈົ້າ —'),
    students.map(s => h('option', {value:s.code, selected: s.code === mine}, `${s.no}. ${label(s)}`)));
  app.append(h('div', {class:'row'}, h('b', {}, 'ເຈົ້າແມ່ນ:'), sel,
    mine && mypin && myGroup && !a.locked ? h('button', {class:'danger', onclick:() => rpc('leave_group', {p_activity:id, p_code:mine, p_pin:mypin})}, 'ອອກຈາກກຸ່ມ') : null));
  if (mine && !mypin) {
    const pinInp = h('input', {type:'password', inputmode:'numeric', autocomplete:'off', placeholder:'PIN 4 ຕົວເລກ', maxlength:4, style:'width:130px'});
    const verify = async () => {
      const r = await sb.rpc('verify_pin', {p_code: mine, p_pin: pinInp.value.trim()});
      if (r.data === true) { store.set('mypin', pinInp.value.trim()); toast = ''; }
      else toast = r.error ? r.error.message : 'PIN ບໍ່ຖືກຕ້ອງ';
      render();
    };
    pinInp.addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
    app.append(h('div', {class:'row'}, h('b', {}, 'PIN:'), pinInp, h('button', {class:'primary', onclick:verify}, 'ຢືນຢັນ'),
      h('span', {class:'mute'}, '4 ຕົວທ້າຍຂອງລະຫັດນັກສຶກສາ')));
  }

  const adminPin = sget('pin');
  const grid = h('div', {class:'grid'});
  for (let g = 1; g <= a.group_count; g++) {
    const gm = ms.filter(m => m.group_no === g);
    const isFull = gm.length >= a.group_size;
    const isMine = myGroup === g;
    const btn = h('button', {
      class: isMine ? '' : 'primary',
      disabled: !mine || !mypin || a.locked || isMine || isFull,
      onclick: () => rpc('join_group', {p_activity:id, p_code:mine, p_pin:mypin, p_group:g}),
    }, isMine ? 'ເຈົ້າຢູ່ກຸ່ມນີ້ ♡' : isFull ? 'ເຕັມແລ້ວ' : myGroup ? 'ຍ້າຍມາກຸ່ມນີ້' : 'ເຂົ້າກຸ່ມນີ້');
    const dots = a.group_size <= 8
      ? h('span', {class:'dots'}, Array.from({length:a.group_size}, (_, i) => h('i', {class: i < gm.length ? 'on' : ''})))
      : null;

      h('ul', {}, gm.length

// centred confirm box (replaces the browser's confirm()/prompt() pop-ups)
function ask(msg, okLabel = 'ຕົກລົງ', danger = false) {
  return new Promise(res => {
    const done = v => { ov.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const ok = h('button', {class: danger ? 'primary danger-fill' : 'primary', style:'width:auto', onclick: () => done(true)}, okLabel);
    const onKey = e => { if (e.key === 'Escape') done(false); };
    const ov = h('div', {class:'ov', role:'alertdialog', 'aria-modal':'true', onclick: e => { if (e.target === ov) done(false); }},
      h('div', {class:'dlg'}, h('div', {style:'margin-bottom:12px;line-height:1.5'}, msg),
        h('div', {class:'row', style:'margin:0;justify-content:flex-end'}, h('button', {onclick: () => done(false)}, 'ຍົກເລີກ'), ok)));
    document.body.append(ov); document.addEventListener('keydown', onKey); ok.focus();
  });
}
function showLink(link) {
  const inp = h('input', {value: link, readonly:'', 'aria-label':'ລິ້ງ', style:'width:100%;box-sizing:border-box'});
  const ov = h('div', {class:'ov', onclick: e => { if (e.target === ov) ov.remove(); }},
    h('div', {class:'dlg'}, h('div', {style:'margin-bottom:8px'}, 'ຄັດລອກລິ້ງນີ້:'), inp,
      h('div', {class:'row', style:'margin:10px 0 0;justify-content:flex-end'}, h('button', {class:'primary', style:'width:auto', onclick: () => ov.remove()}, 'ປິດ'))));
  document.body.append(ov); inp.focus(); inp.select();
}

// centred dialog asking the person to re-enter their PIN before a note is saved
function pinDialog(onSubmit) {
  const inp = h('input', {type:'password', inputmode:'numeric', autocomplete:'off', maxlength:4, placeholder:'PIN 4 ຕົວເລກ', 'aria-label':'PIN'});
  const err = h('div', {class:'nmsg bad'});
  const ok = h('button', {class:'primary', style:'width:auto'}, 'ຢືນຢັນ');
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const submit = async () => {
    if (!/^\d{4}$/.test(inp.value.trim())) { err.textContent = 'ໃສ່ PIN 4 ຕົວເລກ'; return; }
    ok.disabled = true; err.textContent = '';
    const m = await onSubmit(inp.value.trim());
    if (m) { err.textContent = m; ok.disabled = false; inp.value = ''; inp.focus(); } else close();
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  ok.addEventListener('click', submit);
  const ov = h('div', {class:'ov', role:'dialog', 'aria-modal':'true', onclick: e => { if (e.target === ov) close(); }},
    h('div', {class:'dlg'}, h('h2', {style:'margin:0 0 6px'}, 'ຢືນຢັນ PIN'),
      h('div', {class:'mute', style:'margin-bottom:10px'}, 'ໃສ່ PIN (4 ຕົວທ້າຍຂອງລະຫັດນັກສຶກສາ) ເພື່ອບັນທຶກໂນ້ດ'),
      inp, err, h('div', {class:'row', style:'margin-bottom:0'}, ok, h('button', {onclick:close}, 'ຍົກເລີກ'))));
  document.body.append(ov); document.addEventListener('keydown', onKey); inp.focus();
}

// a small message board per group: everyone reads it, only that group's members (and the admin) write
const noteOpen = {}, noteMsg = {}, NOTE_MAX = 100;
function noteBox(id, g, role, mine, mypin, adminPin) {
  const saved = notes.find(n => n.activity_id === id && n.group_no === g);
  const k = id + ':' + g, msg = noteMsg[k];
  const msgEl = msg ? h('div', {class:'nmsg' + (msg.bad ? ' bad' : '')}, msg.t) : null;
  if (!noteOpen[k]) {
    if (!saved && !role && !msg) return null;
    return h('div', {class:'note'},
      saved ? h('div', {class:'nline'}, '📝 ' + saved.note) : null,
      role ? h('button', {class:'pen', title:'ຂຽນໂນ້ດ', 'aria-label':'ຂຽນໂນ້ດຂອງກຸ່ມ', onclick: () => {
        noteOpen[k] = true; delete noteMsg[k]; render();
        setTimeout(() => app.querySelector('textarea[data-k="' + k + '"]')?.focus());
      }}, '✎') : null,
      msgEl);
  }
  const counter = h('div', {class:'ncount'});
  const ta = h('textarea', {rows:3, maxlength:NOTE_MAX, 'data-k':k, placeholder:'ຂຽນບອກໝູ່ ເຊັ່ນ ກຸ່ມເຮົາເລືອກບົດທີ 3 ແລ້ວ ♡',
    oninput: e => { noteDraft[k] = e.target.value; counter.textContent = e.target.value.length + '/' + NOTE_MAX; }});
  ta.value = k in noteDraft ? noteDraft[k] : (saved ? saved.note : '');
  counter.textContent = ta.value.length + '/' + NOTE_MAX;
  const close = () => { noteOpen[k] = false; delete noteDraft[k]; render(); };
  return h('div', {class:'note open'}, ta, counter, h('div', {class:'row', style:'margin:6px 0 0'},
    h('button', {class:'primary', style:'width:auto;min-height:36px;padding:4px 16px', onclick: async () => {
      const text = k in noteDraft ? noteDraft[k] : (saved ? saved.note : '');
      const done = async () => { noteOpen[k] = false; delete noteDraft[k]; noteMsg[k] = {t:'✓ ບັນທຶກແລ້ວ'}; setTimeout(() => { delete noteMsg[k]; render(); }, 2500); await load(); render(); };
      if (role === 'admin') {
        const r = await rpc('admin_set_group_note', {p_pin:adminPin, p_activity:id, p_group:g, p_note:text});
        if (r.error) noteMsg[k] = {t: r.error.message, bad: true}; else await done();
        return render();
      }
      pinDialog(async pin => {
        const r = await sb.rpc('set_group_note', {p_activity:id, p_code:mine, p_pin:pin, p_group:g, p_note:text});
        if (r.error) return r.error.message;
        await done(); return null;
      });
    }}, 'ບັນທຶກ'),
    h('button', {style:'min-height:36px;padding:4px 14px', onclick:close}, 'ຍົກເລີກ')),
    msgEl);
}

        h('button', {onclick:() => admin('admin_set_lock', {p_activity:a.id, p_locked:!a.locked})}, a.locked ? 'ປົດລ໋ອກ' : 'ລ໋ອກ'),
        h('button', {disabled: !left || a.locked, onclick: async () => { if (await ask(`ສຸ່ມຈັດຄົນທີ່ເຫຼືອ ${left} ຄົນ?`)) admin('admin_random_fill', {p_activity:a.id}); }}, `ສຸ່ມຄົນທີ່ເຫຼືອ (${left})`),
        h('button', {onclick:() => exportCsv(a, ms, codes)}, 'ດາວໂຫຼດ CSV'),
        h('button', {class:'danger', onclick: async () => { if (await ask('ລຶບກິດຈະກຳນີ້? (ລຶບກຸ່ມ ແລະ ໂນ້ດທັງໝົດຂອງກິດຈະກຳນີ້)', 'ລຶບ', true)) admin('admin_delete_activity', {p_activity:a.id}); }}, 'ລຶບ')));
    const dr = (drafts[a.id] ||= {open:false, title:a.title, count:a.group_count, size:a.group_size});
    box.append(h('details', {open: dr.open ? '' : null, ontoggle: e => { dr.open = e.target.open; }},
      h('summary', {}, 'ແກ້ໄຂຊື່ / ຈຳນວນກຸ່ມ / ຄົນຕໍ່ກຸ່ມ'),
      h('div', {class:'row'},
        h('input', {value:dr.title, 'aria-label':'ຊື່ກິດຈະກຳ', oninput: e => { dr.title = e.target.value; }}),
        h('input', {type:'number', min:1, max:50, value:dr.count, style:'width:90px', 'aria-label':'ຈຳນວນກຸ່ມ', oninput: e => { dr.count = e.target.value; }}),
        h('input', {type:'number', min:1, max:100, value:dr.size, style:'width:90px', 'aria-label':'ຄົນຕໍ່ກຸ່ມ', oninput: e => { dr.size = e.target.value; }}),
        h('button', {class:'primary', onclick: async () => {
          const cn = +dr.count, sz = +dr.size;
          if (!(cn >= 1 && cn <= 50 && sz >= 1 && sz <= 100)) { toast = 'ຈຳນວນກຸ່ມ 1-50 ແລະ ຄົນຕໍ່ກຸ່ມ 1-100'; return render(); }
          const gone = ms.filter(m => m.group_no > cn).length;
          if (gone && !(await ask(`ຫຼຸດເຫຼືອ ${cn} ກຸ່ມ ຈະຖອດ ${gone} ຄົນອອກຈາກກຸ່ມທີ່ຖືກລຶບ ດຳເນີນການຕໍ່ບໍ?`))) return;
          const r = await admin('admin_update_activity', {p_activity:a.id, p_title:(dr.title || '').trim() || a.title, p_count:cn, p_size:sz});
          if (!r.error) { delete drafts[a.id]; render(); }
        }}, 'ບັນທຶກ')),
      h('div', {class:'mute'}, 'ຫຼຸດຈຳນວນກຸ່ມ: ຄົນໃນກຸ່ມທີ່ຖືກລຶບຈະຖືກຖອດອອກ · ຫຼຸດຄົນຕໍ່ກຸ່ມ: ຕ້ອງຍ້າຍຄົນທີ່ເກີນອອກກ່ອນ')));
    const det = h('details', {}, h('summary', {}, 'ຍ້າຍ/ຖອດສະມາຊິກ'));
    for (const s of students) {
      const cur = ms.find(m => m.student_code === s.code)?.group_no ?? '';
      const opts = [h('option', {value:''}, 'ບໍ່ມີກຸ່ມ')];
      for (let g = 1; g <= a.group_count; g++) opts.push(h('option', {value:g, selected: cur === g}, 'ກຸ່ມ ' + g));
      det.append(h('div', {class:'row', style:'margin:2px 0'},
        h('span', {style:'flex:1;min-width:160px'}, `${s.no}. ${label(s)}`),
        h('select', {onchange: e => admin('admin_move', {p_activity:a.id, p_code:s.code, p_group: e.target.value ? +e.target.value : null})}, opts)));
    }
    box.append(det);
    app.append(box);
  }
}

function exportCsv(a, ms, codes) {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const gOf = Object.fromEntries(ms.map(m => [m.student_code, m.group_no]));
  const rows = [['ກຸ່ມ','ເລກທີ','ລະຫັດນັກສຶກສາ','ຊື່']]
    .concat(students.slice().sort((x,y) => (gOf[x.code] ?? 999) - (gOf[y.code] ?? 999) || x.no - y.no)
    .map(s => [gOf[s.code] ?? 'ຍັງບໍ່ມີກຸ່ມ', s.no, s.code, label(s)]));
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], {type:'text/csv;charset=utf-8'});
  const u = URL.createObjectURL(blob);
  h('a', {href:u, download:`groups_${a.title}.csv`}).click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}
