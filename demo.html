<title>ແບ່ງກຸ່ມ BF124 (ແບບຈຳລອງ)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column like the real app; a "demo" strip on top, tabs switch student view / admin view */
:root{
  /* palette: only these four colours; other tokens are light tints / dark shades of them */
  --c1:#972828; --c2:#e45742; --c3:#eb7f31; --c4:#fcad38;
  --bg:#fff6e8; --card:#fffcf6; --ink:#3a1010; --mute:#85503f; --line:#f4dcb9;
  --accent:#972828; --accent-ink:#fff6e8; --accent2:#e45742; --edge:#eb7f31; --me:#fde5c6; --bad:#972828;
  --warn-bg:#fcad38; --warn-ink:#3a1010; --demo-bg:#972828; --demo-ink:#fff6e8;
  --font:'Noto Sans Lao',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a0c0c; --card:#3a1414; --ink:#ffe9c9; --mute:#e0b48f; --line:#5a2323;
  --accent:#fcad38; --accent-ink:#2a0c0c; --accent2:#e45742; --edge:#eb7f31; --me:#4a1c1a; --bad:#fcad38;
  --warn-bg:#eb7f31; --warn-ink:#2a0c0c; --demo-bg:#fcad38; --demo-ink:#2a0c0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a0c0c; --card:#3a1414; --ink:#ffe9c9; --mute:#e0b48f; --line:#5a2323;
  --accent:#fcad38; --accent-ink:#2a0c0c; --accent2:#e45742; --edge:#eb7f31; --me:#4a1c1a; --bad:#fcad38;
  --warn-bg:#eb7f31; --warn-ink:#2a0c0c; --demo-bg:#fcad38; --demo-ink:#2a0c0c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:900px;margin:0 auto}
.demo{background:var(--demo-bg);color:var(--demo-ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 16px;padding:10px max(16px,env(safe-area-inset-left,0px));font-size:.85rem;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.demo b{font-weight:700}
h1{font-size:1.35rem;margin:0}h2{font-size:1.02rem;margin:0}
.mute{color:var(--mute);font-size:.88rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tab{border:0;background:none;color:var(--mute);font:inherit;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent2);font-weight:700}
button,select,input{font:inherit;color:var(--ink)}
button.b{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button.b.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.b.d{color:var(--bad)}
button.b:disabled{opacity:.45;cursor:not-allowed}
select,input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;min-height:40px;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.card.me{border-color:var(--edge);border-width:2px;padding:11px;background:var(--me)}
.card.full:not(.me){opacity:.62}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}.count.f{color:var(--bad);font-weight:600}
ul{list-style:none;margin:0 0 10px;padding:0;min-height:72px}
li{padding:2px 0;font-size:.92rem;overflow-wrap:anywhere}
li.self{font-weight:700;color:var(--accent)}
li.empty{color:var(--mute);font-size:.82rem}
.banner{padding:10px 12px;border-radius:8px;margin:12px 0;font-size:.9rem}
.banner.lock{background:var(--warn-bg);color:var(--warn-ink)}
.banner.err{background:var(--warn-bg);color:var(--warn-ink)}
.pool{margin-top:16px}.pool span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin:3px 4px 3px 0;font-size:.84rem;background:var(--card)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0;padding:0;list-style:none;min-height:0}
.steps li{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mute)}
.steps li.on{background:var(--accent2);color:#2a0c0c;border-color:var(--accent2);font-weight:600}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums}
.note{font-size:.82rem;color:var(--mute);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s,background .2s}}
</style>

<div class="wrap">
  <div class="demo">
    <span><b>ແບບຈຳລອງ</b> · ຂໍ້ມູນທັງໝົດເປັນຕົວຢ່າງ (ຊື່ແລະ PIN ປອມ) ບໍ່ໄດ້ເຊື່ອມກັບລະບົບຈິງ</span>
    <button class="b" id="reset" type="button">ເລີ່ມໃໝ່</button>
  </div>
  <h1>ແບ່ງກຸ່ມ BF124</h1>
  <div class="mute">ຫ້ອງຕົວຢ່າງ 12 ຄົນ · ຈິງມີ 42 ຄົນ</div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-s" aria-selected="true" type="button">ມຸມມອງເພື່ອນ</button>
    <button class="tab" role="tab" id="tab-a" aria-selected="false" type="button">ມຸມມອງແອດມິນ</button>
  </div>

  <section id="view-s"></section>
  <section id="view-a" hidden></section>
</div>

<script>
const NAMES = ['ນາງ ແກ້ວມະນີ ວົງສະຫວັນ','ນາງ ດາລາ ສີທອງ','ນາງ ມະນີຈັນ ພົມມະລາດ','ນາງ ຈັນສຸດາ ແກ້ວປະເສີດ',
  'ນາງ ບົວຄຳ ສຸລິຍະ','ນາງ ພອນສະຫວັນ ໄຊຍະວົງ','ທ້າວ ສຸກສະຫວັນ ມະນີວົງ','ທ້າວ ທັດສະນະ ຄຳແສນ',
  'ທ້າວ ວິລະສັກ ພັນທະວົງ','ທ້າວ ໄຊຊະນະ ສີວິໄລ','ທ້າວ ອານຸສອນ ບຸນມາ','ທ້າວ ຄຳພອນ ແກ້ວວົງ'];
const PINS = ['0642','0645','0656','0658','0670','0672','0675','0679','0685','0689','0690','0695'];
const students = NAMES.map((n,i)=>({id:i,no:i+1,name:n,pin:PINS[i]}));

let state;
function fresh(){
  return {title:'ກິດຈະກຳວິຊາການບັນຊີ #2', groups:4, size:3, locked:false,
    m:{0:1,1:1,6:2,7:2,8:3}, me:null, pinOk:false, wrong:false, msg:''};
}
try{state=fresh()}catch{}
const $=id=>document.getElementById(id);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){
  if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(x==='class')e.className=v;
  else if(v!==false&&v!=null)e.setAttribute(x,v)}
  for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e};
const inGroup=g=>students.filter(s=>state.m[s.id]===g);

function renderStudent(){
  const root=$('view-s');root.replaceChildren();
  const S=state, me=S.me, myG=me!=null?S.m[me]:undefined;
  root.append(h('h2',{},S.title),h('div',{class:'mute'},`${S.groups} ກຸ່ມ × ${S.size} ຄົນ`));
  root.append(h('ul',{class:'steps'},
    h('li',{class:me==null?'on':''},'1 ເລືອກຊື່'),
    h('li',{class:me!=null&&!S.pinOk?'on':''},'2 ໃສ່ PIN'),
    h('li',{class:S.pinOk?'on':''},'3 ເລືອກກຸ່ມ')));
  if(S.locked)root.append(h('div',{class:'banner lock'},'🔒 ແອດມິນລ໋ອກແລ້ວ ປ່ຽນກຸ່ມບໍ່ໄດ້'));
  if(S.msg)root.append(h('div',{class:'banner err'},S.msg));

  const sel=h('select',{id:'sel-me','aria-label':'ເລືອກຊື່',onchange:e=>{S.me=e.target.value===''?null:+e.target.value;S.pinOk=false;S.msg='';render()}},
    h('option',{value:''},'— ເລືອກຊື່ຂອງເຈົ້າ —'),
    students.map(s=>h('option',{value:s.id,selected:s.id===me},`${s.no}. ${s.name}`)));
  root.append(h('div',{class:'row'},h('b',{},'ເຈົ້າແມ່ນ:'),sel,
    S.pinOk&&myG&&!S.locked?h('button',{class:'b d',type:'button',onclick:()=>{delete S.m[me];S.msg='';render()}},'ອອກຈາກກຸ່ມ'):null));

  if(me!=null&&!S.pinOk){
    const inp=h('input',{id:'pin-in',type:'password',inputmode:'numeric',maxlength:4,placeholder:'PIN 4 ຕົວເລກ',style:'width:130px',autocomplete:'off'});
    const go=()=>{ if(inp.value===students[me].pin){S.pinOk=true;S.msg=''}else{S.msg='PIN ບໍ່ຖືກຕ້ອງ'} render()};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    root.append(h('div',{class:'row'},h('b',{},'PIN:'),inp,h('button',{class:'b p',type:'button',onclick:go},'ຢືນຢັນ'),
      h('span',{class:'mute'},'4 ຕົວທ້າຍຂອງລະຫັດນັກສຶກສາ')));
    root.append(h('div',{class:'note'},`ໃນແບບຈຳລອງ PIN ຂອງຊື່ນີ້ (4 ຕົວທ້າຍຂອງລະຫັດ) ແມ່ນ ${students[me].pin} (ຂອງຈິງເຫັນສະເພາະເຈົ້າຂອງ)`));
  }

  const grid=h('div',{class:'grid'});
  for(let g=1;g<=S.groups;g++){
    const gm=inGroup(g), full=gm.length>=S.size, mine=myG===g;
    const dis=me==null||!S.pinOk||S.locked||mine||full;
    grid.append(h('div',{class:'card'+(mine?' me':'')+(full?' full':'')},
      h('div',{class:'head'},h('h2',{},'ກຸ່ມ '+g),h('span',{class:'count'+(full?' f':'')},`${gm.length}/${S.size}`)),
      h('ul',{},gm.length?gm.map(s=>h('li',{class:s.id===me?'self':''},s.name)):h('li',{class:'empty'},'ຍັງບໍ່ມີໃຜ')),
      h('button',{class:'b '+(mine?'':'p'),type:'button',disabled:dis,onclick:()=>{
        if(inGroup(g).length>=S.size){S.msg='ກຸ່ມນີ້ເຕັມແລ້ວ';render();return}
        S.m[me]=g;S.msg='';render()}},mine?'ເຈົ້າຢູ່ກຸ່ມນີ້':full?'ເຕັມ':myG?'ຍ້າຍມາກຸ່ມນີ້':'ເຂົ້າກຸ່ມນີ້')));
  }
  root.append(grid);

  const left=students.filter(s=>S.m[s.id]==null);
  root.append(h('div',{class:'pool'},h('b',{},`ຍັງບໍ່ໄດ້ເລືອກກຸ່ມ (${left.length})`),h('div',{},left.map(s=>h('span',{},s.name)))));
  root.append(h('div',{class:'row'},h('button',{class:'b',type:'button',disabled:S.locked,onclick:()=>{
      const free=left.filter(s=>s.id!==me);const open=[];
      for(let g=1;g<=S.groups;g++)for(let k=inGroup(g).length;k<S.size;k++)open.push(g);
      if(!free.length||!open.length){S.msg='ບໍ່ມີທີ່ວ່າງ ຫຼື ບໍ່ມີຄົນເຫຼືອ';render();return}
      const s=free[Math.floor(Math.random()*free.length)];S.m[s.id]=open[Math.floor(Math.random()*open.length)];S.msg='';render()}},
    'ຈຳລອງ: ເພື່ອນຄົນໜຶ່ງເຂົ້າກຸ່ມ'),
    h('span',{class:'note'},'ໃນລະບົບຈິງ ໜ້າຈໍເຫັນການປ່ຽນແປງທັນທີ ບໍ່ຕ້ອງຣີເຟຣຊ')));
}

function renderAdmin(){
  const root=$('view-a');root.replaceChildren();const S=state;
  const t=h('input',{id:'a-title',value:S.title,'aria-label':'ຊື່ກິດຈະກຳ'});
  const c=h('input',{id:'a-count',type:'number',min:1,max:12,value:S.groups,style:'width:90px','aria-label':'ຈຳນວນກຸ່ມ'});
  const z=h('input',{id:'a-size',type:'number',min:1,max:12,value:S.size,style:'width:90px','aria-label':'ຄົນຕໍ່ກຸ່ມ'});
  root.append(h('div',{class:'card'},h('h2',{},'ສ້າງ / ແກ້ກິດຈະກຳ'),
    h('div',{class:'row'},t,c,z,h('button',{class:'b p',type:'button',onclick:()=>{
      const g=Math.max(1,Math.min(12,+c.value||1)),n=Math.max(1,Math.min(12,+z.value||1));
      S.title=t.value.trim()||S.title;S.groups=g;S.size=n;S.m={};S.me=null;S.pinOk=false;S.locked=false;S.msg='';render()}},'ສ້າງໃໝ່')),
    h('div',{class:'note'},'ຈຳນວນກຸ່ມ · ຄົນຕໍ່ກຸ່ມ  (ແຕ່ລະວິຊາຕັ້ງໃໝ່ໄດ້) ການສ້າງໃໝ່ຈະລ້າງການເລືອກເດີມ')));
  const done=Object.keys(S.m).length, left=students.length-done;
  root.append(h('div',{class:'card',style:'margin-top:12px'},h('h2',{},S.title,S.locked?' 🔒':''),
    h('div',{class:'mute'},`${S.groups} ກຸ່ມ × ${S.size} ຄົນ · ເລືອກແລ້ວ ${done}/${students.length}`),
    h('div',{class:'row'},
      h('button',{class:'b',type:'button',onclick:()=>{S.locked=!S.locked;render()}},S.locked?'ປົດລ໋ອກ':'ລ໋ອກ'),
      h('button',{class:'b',type:'button',disabled:!left||S.locked,onclick:()=>{
        const free=students.filter(s=>S.m[s.id]==null).sort(()=>Math.random()-.5);
        for(const s of free){let best=0,bc=1e9;for(let g=1;g<=S.groups;g++){const n=inGroup(g).length;if(n<S.size&&n<bc){bc=n;best=g}}
          if(!best)break;S.m[s.id]=best}render()}},`ສຸ່ມຄົນທີ່ເຫຼືອ (${left})`),
      h('button',{class:'b d',type:'button',onclick:()=>{S.m={};S.pinOk=false;render()}},'ລ້າງທັງໝົດ'),
      h('span',{class:'note'},'ຂອງຈິງມີ: ຄັດລອກລິ້ງ · ດາວໂຫຼດ CSV · ລຶບກິດຈະກຳ')),
    h('details',{},h('summary',{},'ຍ້າຍ / ຖອດສະມາຊິກ'),
      students.map(s=>h('div',{class:'row',style:'margin:2px 0'},h('span',{style:'flex:1;min-width:150px'},`${s.no}. ${s.name}`),
        h('select',{'aria-label':'ກຸ່ມຂອງ '+s.name,onchange:e=>{const v=e.target.value;if(v==='')delete S.m[s.id];else S.m[s.id]=+v;render()}},
          h('option',{value:''},'ບໍ່ມີກຸ່ມ'),
          Array.from({length:S.groups},(_,i)=>h('option',{value:i+1,selected:S.m[s.id]===i+1},'ກຸ່ມ '+(i+1)))))))));
  const rows=students.map(s=>h('tr',{},h('td',{class:'num'},s.no),h('td',{},s.name),h('td',{class:'num'},'BI12241000'+s.pin.slice(0,0)+'··'+s.pin),h('td',{class:'num'},s.pin)));
  root.append(h('div',{class:'card',style:'margin-top:12px'},h('h2',{},'PIN ຂອງນັກສຶກສາ'),
    h('div',{class:'note'},'PIN ແມ່ນ 4 ຕົວທ້າຍຂອງລະຫັດນັກສຶກສາ ເພື່ອນບໍ່ຕ້ອງລໍຖ້າຮັບ PIN · ຕາຕະລາງນີ້ເປັນຂໍ້ມູນປອມ'),
    h('div',{class:'tablewrap'},h('table',{},h('thead',{},h('tr',{},['ເລກທີ','ຊື່','ລະຫັດ (ຕົວຢ່າງ)','PIN'].map(x=>h('th',{},x)))),h('tbody',{},rows)))));
}

function render(){renderStudent();renderAdmin()}
function tab(which){
  const s=which==='s';
  $('view-s').hidden=!s;$('view-a').hidden=s;
  $('tab-s').setAttribute('aria-selected',s);$('tab-a').setAttribute('aria-selected',!s);
}
$('tab-s').onclick=()=>tab('s');$('tab-a').onclick=()=>tab('a');
$('reset').onclick=()=>{state=fresh();render();tab('s')};
render();
</script>
